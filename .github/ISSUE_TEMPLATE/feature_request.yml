name: Feature request
description: Something the library could do
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: What you are trying to do
      description: The problem, before the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you propose
  - type: textarea
    id: alternatives
    attributes:
      label: What you do today instead
